name: Build and Push Docker image

on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
      push:
        required: false
        default: 'true'
      manylinux:
        required: false
        default: 'manylinux_2_38'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get tag
        run: |
          branch=${{ github.event.inputs.branch }} 
          manylinux=${{ github.event.inputs.manylinux }}
          tag=${branch#opencv-ci_}
          ls docker/${manylinux}/

          echo "tag=${tag}" >> $GITHUB_ENV
          echo "manylinux=${manylinux}" >> $GITHUB_ENV

      - name: Build and Push image
        uses: docker/build-push-action@v6
        with:
          context: docker/${{ env.manylinux }}/
          platforms: linux/loong64
          push: ${{ github.event.inputs.push }}
          tags: |
                  ghcr.io/loongson-cloud-community/opencv-python-${{ env.manylinux }}-loongarch64:latest
                  ghcr.io/loongson-cloud-community/opencv-python-${{ env.manylinux }}-loongarch64:${{ env.tag }}
          outputs: type=image,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
